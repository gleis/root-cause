name: PostgreSQL image
on:
  push:
  pull_request:
  schedule:
    - cron: '49 9 * * 1'
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/postgres/Dockerfile -t rootcause-postgres:16-secure .
      - run: deploy/postgres/smoke.sh
      - uses: aquasecurity/trivy-action@0.35.0
        with:
          version: v0.76.2
          image-ref: rootcause-postgres:16-secure
          scanners: vuln
          exit-code: '1'
          ignore-unfixed: false
