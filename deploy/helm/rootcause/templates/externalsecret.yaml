{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "rootcause.fullname" . }}
  labels:
    {{- include "rootcause.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef.name }}
    kind: {{ .Values.externalSecrets.secretStoreRef.kind }}
  target:
    name: {{ .Values.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: database-url
      remoteRef:
        key: {{ .Values.config.vaultKvPath }}
        property: database_url
    - secretKey: gitlab-token
      remoteRef:
        key: {{ .Values.config.vaultKvPath }}
        property: gitlab_token
    - secretKey: slack-bot-token
      remoteRef:
        key: {{ .Values.config.vaultKvPath }}
        property: slack_bot_token
    - secretKey: slack-signing-secret
      remoteRef:
        key: {{ .Values.config.vaultKvPath }}
        property: slack_signing_secret
{{- end }}
